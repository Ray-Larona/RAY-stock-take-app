<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            📦
        </div>

        <div class="title-area">

            <h1>Stock Take Pro</h1>

            <p>by RNTL</p>

        </div>

    </div>

    <!-- LOCATION -->

    <div class="card">

        <label class="label">
            Select Location
        </label>

        <div class="location-buttons">

            <button id="locationA">
                Warehouse A
            </button>

            <button id="locationB">
                Warehouse B
            </button>

        </div>

    </div>

    <!-- ACTION BUTTONS -->

    <div class="card">

        <button
            id="scanBtn"
            class="scan-btn"
            onclick="startScanner()">

            📷 SCAN BARCODE

        </button>

        <div class="manual-input">

            <input
                id="manualBarcode"
                placeholder="Enter Barcode">

            <button onclick="manualAdd()">

                ADD

            </button>

        </div>

        <button
            id="uploadBtn">

            ☁ UPLOAD STOCK TAKE

        </button>

    </div>

  <!-- ===========================
     SCANNER
=========================== -->

<div id="cameraBox">

    <div id="reader"></div>

    <div class="scanner-overlay"></div>

    <div class="scanner-card">

        <div class="scanner-header">

            <span>
                SCAN BARCODE
            </span>

            <button
                id="closeCameraBtn"
                onclick="stopScanner()">

                ✕

            </button>

        </div>

        <div class="scanner-body">

            <div class="scan-frame">

                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>

                <div class="scan-line"></div>

            </div>

        </div>

        <div class="scanner-footer">

            Point the camera at the barcode

        </div>

    </div>

</div>
